services:
  - type: web
    name: toefl-telegram-bot
    runtime: python
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ADMIN_IDS
        sync: false
