services:
  - type: web
    name: toefl-telegram-bot
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/database.db
      - key: DEBUG
        value: "false"
      - key: ADMIN_IDS
        value: "5423668260"
