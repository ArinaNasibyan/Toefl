[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "toefl-telegram-bot"
version = "0.1.0"
description = "A professional TOEFL preparation Telegram bot built with aiogram, SQLAlchemy, and Clean Architecture."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.0,<4.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "alembic>=1.13,<2.0",
    "edge-tts>=6.1.0",
    "pydub>=0.25.1",
    "static-ffmpeg>=2.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<8.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "bot", "application", "domain", "infrastructure"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
